name: LearnSphere Keep-Alive

on:
  schedule:
    # Runs every 5 minutes (Render Free Tier inactivity timeout is 15 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-services:
    name: Ping Render Services
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping All Services in Parallel
        run: |
          SERVICES=(
            "https://api-gateway-80go.onrender.com"
            "https://auth-service-80go.onrender.com"
            "https://course-service-80go.onrender.com"
            "https://enrollment-service-80go.onrender.com"
            "https://learn-progress-service-80go.onrender.com"
            "https://discussion-notification-service-80go.onrender.com"
            "https://admin-analytics-service-80go.onrender.com"
            "https://certificate-service-80go.onrender.com"
          )

          echo "Initiating parallel keep-alive pings against ${#SERVICES[@]} services..."
          
          for service in "${SERVICES[@]}"; do
            (
              URL="${service}/actuator/health"
              # Perform a lightweight HEAD or GET request. We use GET since Actuator health is very small.
              # Timeout set to 10s connection timeout and 20s total response timeout.
              RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 20 -L "$URL")
              
              if [ "$RESPONSE_CODE" = "200" ]; then
                echo "✅ SUCCESS: [200] $service is warm and healthy."
              else
                echo "⚠️ WARNING: [$RESPONSE_CODE] $service health check failed or timed out."
              fi
            ) &
          done
          
          # Wait for all background ping processes to complete
          wait
          echo "All keep-alive pings completed."
