name: LearnSphere Keep-Alive

on:
  schedule:
    # Runs every 5 minutes (Render Free Tier inactivity timeout is 15 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-services:
    name: Ping Render Services
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping All Services in Parallel
        run: |
          SERVICES=(
            "https://api-gateway-80go.onrender.com/actuator/health"
            "https://api-gateway-80go.onrender.com/api/auth/actuator/health"
            "https://api-gateway-80go.onrender.com/api/courses/actuator/health"
            "https://api-gateway-80go.onrender.com/api/enrollments/actuator/health"
            "https://api-gateway-80go.onrender.com/api/progress/actuator/health"
            "https://api-gateway-80go.onrender.com/notifications/actuator/health"
            "https://api-gateway-80go.onrender.com/api/admin/actuator/health"
            "https://api-gateway-80go.onrender.com/api/certificates/actuator/health"
          )

          echo "Initiating parallel keep-alive pings against ${#SERVICES[@]} services..."
          
          for service in "${SERVICES[@]}"; do
            (
              URL="$service"
              # Perform a lightweight GET request.
              # Increased timeouts to 60s connect and 90s max-time to allow Render Free Tier cold starts (50s+)
              # without aborting early and triggering Render's hibernate-rate-limited protection.
              RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 60 --max-time 90 -L "$URL")
              
              if [ "$RESPONSE_CODE" = "200" ]; then
                echo "✅ SUCCESS: [200] $service is warm and healthy."
              else
                echo "⚠️ WARNING: [$RESPONSE_CODE] $service health check failed or timed out."
              fi
            ) &
          done
          
          # Wait for all background ping processes to complete
          wait
          echo "All keep-alive pings completed."
