name: LearnSphere Keep-Alive

on:
  schedule:
    # Render Free web services spin down after 15 minutes without inbound traffic.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-services:
    name: Ping Render services through the gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: learnsphere-render-keep-alive
      cancel-in-progress: false

    steps:
      - name: Ping each downstream health endpoint
        shell: bash
        run: |
          set -u

          BASE_URL="https://api-gateway-80go.onrender.com"
          HEALTH_PATHS=(
            "/api/auth/actuator/health"
            "/api/courses/actuator/health"
            "/api/enrollments/actuator/health"
            "/api/progress/actuator/health"
            "/notifications/actuator/health"
            "/api/admin/actuator/health"
            "/api/certificates/actuator/health"
          )

          failures=0

          for path in "${HEALTH_PATHS[@]}"; do
            status=$(curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 60 \
              --max-time 150 \
              --user-agent "LearnSphere-GitHub-Keep-Alive/1.0" \
              "${BASE_URL}${path}") || status="000"

            if [[ "$status" == "200" ]]; then
              echo "OK   ${path}"
            elif [[ "$status" == "429" ]]; then
              echo "RATE LIMITED ${path}; not retrying"
              failures=$((failures + 1))
            else
              echo "FAIL [${status}] ${path}"
              failures=$((failures + 1))
            fi

            # Serialize requests to keep traffic gentle on the gateway.
            sleep 2
          done

          if (( failures > 0 )); then
            echo "::warning::${failures} service health ping(s) failed."
          fi
