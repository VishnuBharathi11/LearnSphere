name: Keep core services warm

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: learnsphere-keep-alive
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
      COURSE_SERVICE_URL: ${{ vars.COURSE_SERVICE_URL }}
      GATEWAY_URL: ${{ vars.GATEWAY_URL }}

    steps:
      - name: Warm Auth, Course, then Gateway
        continue-on-error: true
        timeout-minutes: 8
        shell: bash
        run: |
          set +e

          started_at=$(date +%s)

          request_health() {
            local service_name="$1"
            local endpoint="$2"
            local response_file
            local http_status
            local curl_exit
            local request_started
            local request_finished

            response_file=$(mktemp)
            request_started=$(date +%s)

            http_status=$(curl \
              --silent \
              --show-error \
              --location \
              --connect-timeout 10 \
              --max-time 120 \
              --retry 3 \
              --retry-delay 5 \
              --retry-max-time 120 \
              --retry-all-errors \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              "${endpoint}")

            curl_exit=$?
            request_finished=$(date +%s)

            echo "${service_name} response (curl_exit=${curl_exit}, http_status=${http_status:-unavailable}, duration=$((request_finished - request_started))s):"

            if [ -s "${response_file}" ]; then
              cat "${response_file}"
            else
              echo "<empty response>"
            fi

            echo
            rm -f "${response_file}"

            if [ "${curl_exit}" -eq 0 ] &&
               [ "${http_status}" -ge 200 ] 2>/dev/null &&
               [ "${http_status}" -lt 300 ] 2>/dev/null; then
              return 0
            fi

            return 1
          }

          if [ -z "${AUTH_SERVICE_URL}" ] ||
             [ -z "${COURSE_SERVICE_URL}" ] ||
             [ -z "${GATEWAY_URL}" ]; then
            echo "::warning::Missing repository variables."
            exit 0
          fi

          echo "Starting Auth and Course warmup..."

          request_health \
            "Auth Service initial ping" \
            "${AUTH_SERVICE_URL%/}/api/auth/actuator/health" &

          AUTH_PID=$!

          request_health \
            "Course Service initial ping" \
            "${COURSE_SERVICE_URL%/}/api/courses/actuator/health" &

          COURSE_PID=$!

          wait $AUTH_PID || true
          wait $COURSE_PID || true

          echo "Waiting for services to boot..."
          sleep 60

          echo "Verifying Auth Service..."

          if request_health \
            "Auth Service verification ping" \
            "${AUTH_SERVICE_URL%/}/api/auth/actuator/health"
          then
            echo "Auth Service UP."
          else
            echo "Auth Service WAKING_UP..."
          fi

          echo "Verifying Course Service..."

          if request_health \
            "Course Service verification ping" \
            "${COURSE_SERVICE_URL%/}/api/courses/actuator/health"
          then
            echo "Course Service UP."
          else
            echo "Course Service WAKING_UP..."
          fi

          if request_health \
            "API Gateway" \
            "${GATEWAY_URL%/}/actuator/health"
          then
            echo "Gateway warmed successfully."
          else
            echo "::warning::Gateway is still waking up."
          fi

          finished_at=$(date +%s)
          echo "Startup duration: $((finished_at - started_at)) seconds."

          exit 0