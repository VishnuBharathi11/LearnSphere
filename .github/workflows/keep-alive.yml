name: LearnSphere Keep-Alive

on:
  schedule:
    # Runs every 5 minutes (Render Free Tier inactivity timeout is 15 minutes)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-services:
    name: Ping Render Services
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping All Services in Parallel
        run: |
          SERVICES=(
            "https://api-gateway-80go.onrender.com/actuator/health"
            "https://auth-service.onrender.com/api/auth/actuator/health"
            "https://course-service.onrender.com/api/courses/actuator/health"
            "https://enrollment-service.onrender.com/api/enrollments/actuator/health"
            "https://learn-progress-service.onrender.com/api/progress/actuator/health"
            "https://discussion-notification-service.onrender.com/notifications/actuator/health"
            "https://admin-analytics-service.onrender.com/api/admin/actuator/health"
            "https://certificate-service.onrender.com/api/certificates/actuator/health"
          )

          echo "Initiating sequential keep-alive pings against ${#SERVICES[@]} services..."
          
          for service in "${SERVICES[@]}"; do
            URL="$service"
            RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 60 --max-time 90 -L "$URL")
            
            if [ "$RESPONSE_CODE" = "200" ]; then
              echo "✅ SUCCESS: [200] $service is warm and healthy."
            else
              echo "⚠️ WARNING: [$RESPONSE_CODE] $service health check failed or timed out."
            fi
            
            # Sleep for 5 seconds between pings to prevent triggering Render's hibernate-rate-limited proxy
            sleep 5
          done
          
          echo "All keep-alive pings completed."
