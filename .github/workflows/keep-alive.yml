name: Keep core services warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Warm API Gateway, Auth Service, and Course Service
        continue-on-error: true
        shell: bash
        run: |
          endpoint="https://api-gateway-hgh1.onrender.com/warmup"

          for attempt in 1 2 3; do
            echo "Warmup attempt ${attempt}/3"
            response_file="$(mktemp)"
            status="$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 45 \
              --output "${response_file}" \
              --write-out "%{http_code}" \
              "${endpoint}")" && curl_exit=0 || curl_exit=$?

            echo "HTTP status: ${status:-unavailable}"
            echo "Response:"
            cat "${response_file}"
            echo
            rm -f "${response_file}"

            if [ "${curl_exit}" -eq 0 ] && [ "${status}" -ge 200 ] && [ "${status}" -lt 300 ]; then
              echo "Warmup completed."
              exit 0
            fi

            if [ "${attempt}" -lt 3 ]; then
              sleep $((attempt * 5))
            fi
          done

          echo "::warning::Warmup did not succeed after 3 attempts; the workflow is completing gracefully."
          exit 0
