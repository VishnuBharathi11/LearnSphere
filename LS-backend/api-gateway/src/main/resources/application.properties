server.port=8084
spring.application.name=api-gateway

# ================= ROUTES =================

# AUTH SERVICE
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://${AUTH_SERVICE_HOSTPORT:127.0.0.1:9097}}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# ENROLLMENT SERVICE
spring.cloud.gateway.routes[1].id=enrollment-service
spring.cloud.gateway.routes[1].uri=${ENROLLMENT_SERVICE_URL:http://${ENROLLMENT_SERVICE_HOSTPORT:127.0.0.1:9092}}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/enrollments/**,/api/payments/**,/payments/**,/enrollments/**

# DISCUSSION SERVICE
spring.cloud.gateway.routes[2].id=discussion-service
spring.cloud.gateway.routes[2].uri=${DISCUSSION_SERVICE_URL:http://${DISCUSSION_SERVICE_HOSTPORT:127.0.0.1:9091}}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/courses/*/threads/**,/api/courses/*/threads,/api/threads/**,/api/replies/**,/notifications/**,/discussion/**

# ADMIN SERVICE
spring.cloud.gateway.routes[3].id=admin-service
spring.cloud.gateway.routes[3].uri=${ADMIN_SERVICE_URL:http://${ADMIN_SERVICE_HOSTPORT:127.0.0.1:8085}}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/admin/**,/admin/**

# LEARN PROGRESS SERVICE
spring.cloud.gateway.routes[4].id=learn-progress-service
spring.cloud.gateway.routes[4].uri=${PROGRESS_SERVICE_URL:http://${PROGRESS_SERVICE_HOSTPORT:127.0.0.1:9093}}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/progress/**

# COURSE SERVICE
spring.cloud.gateway.routes[5].id=course-service
spring.cloud.gateway.routes[5].uri=${COURSE_SERVICE_URL:http://${COURSE_SERVICE_HOSTPORT:127.0.0.1:9091}}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/courses/**,/api/categories/**

# CERTIFICATE SERVICE
spring.cloud.gateway.routes[6].id=certificate-service
spring.cloud.gateway.routes[6].uri=${CERTIFICATE_SERVICE_URL:http://${CERTIFICATE_SERVICE_HOSTPORT:127.0.0.1:9099}}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/certificates/**

# DEBUG LOGS
logging.level.org.springframework.cloud.gateway=DEBUG



