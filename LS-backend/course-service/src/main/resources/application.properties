spring.application.name=course-service

spring.data.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/learnsphere_db}
spring.data.mongodb.auto-index-creation=true

server.port=${PORT:9091}

jwt.secret=${JWT_SECRET:learnsphere-super-secure-jwt-secret-key-2026-project-auth-service}
jwt.expiration=86400000

admin.service.base-url=${ADMIN_ANALYTICS_SERVICE_URL:http://${ADMIN_ANALYTICS_SERVICE_HOSTPORT:localhost:9095}}

# Disable default generated Spring Security user/password
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
