spring.application.name=certificate-service
server.port=${PORT:9099}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

certificate.public-base-url=${FRONTEND_PUBLIC_URL:http://localhost:5173}
# Use internal service URL for server-side PDF rendering (not frontend)
certificate.render-base-url=${CERTIFICATE_SERVICE_URL:http://${CERTIFICATE_SERVICE_HOSTPORT:localhost:9099}}/api/certificates/render
certificate.storage.local-root=storage/certificates
certificate.pdf.node-command=node
# Use absolute path to script for reliable execution
certificate.pdf.script-path=${project.basedir}/scripts/render-certificate-pdf.mjs
# Reduced timeout to avoid API Gateway timeout (30s default)
certificate.pdf.timeout-seconds=30

spring.security.oauth2.resourceserver.jwt.secret-key=${JWT_SECRET:learnsphere-super-secure-jwt-secret-key-2026-project-auth-service}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.learnsphere.certificate=INFO
# Enable debug logging for certificate service to diagnose PDF generation issues
logging.level.com.learnsphere.certificate.service.PuppeteerPdfGenerationService=DEBUG

# ================= ACTUATOR (KEEP-ALIVE) =================
management.endpoints.web.base-path=/api/certificates/actuator
management.endpoints.web.exposure.include=health
management.health.defaults.enabled=false
management.health.ping.enabled=true

logging.level.org.springframework.jdbc=DEBUG
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate=DEBUG
