# Render Blueprint Specification for LearnSphere Microservices using Docker
services:

  # 1. API Gateway
  - type: web
    name: api-gateway
    env: docker
    plan: free
    rootDir: LS-backend/api-gateway
    envVars:
      - key: PORT
        value: 8084
      - key: AUTH_SERVICE_URL
        value: http://auth-service.render.internal:9098
      - key: ENROLLMENT_SERVICE_URL
        value: http://enrollment-service.render.internal:9092
      - key: DISCUSSION_SERVICE_URL
        value: http://discussion-notification-service.render.internal:9094
      - key: ADMIN_SERVICE_URL
        value: http://admin-analytics-service.render.internal:9095
      - key: PROGRESS_SERVICE_URL
        value: http://learn-progress-service.render.internal:9093
      - key: COURSE_SERVICE_URL
        value: http://course-service.render.internal:9091
      - key: CERTIFICATE_SERVICE_URL
        value: http://certificate-service.render.internal:9099

  # 2. Auth Service
  - type: web
    name: auth-service
    env: docker
    plan: free
    rootDir: LS-backend/auth-service
    envVars:
      - key: PORT
        value: 9098
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_ANALYTICS_SERVICE_URL
        value: http://admin-analytics-service.render.internal:9095

  # 3. Course Service
  - type: web
    name: course-service
    env: docker
    plan: free
    rootDir: LS-backend/course-service
    envVars:
      - key: PORT
        value: 9091
      - key: SPRING_MONGODB_URI
        sync: false

  # 4. Enrollment Service
  - type: web
    name: enrollment-service
    env: docker
    plan: free
    rootDir: LS-backend/enrollment-service
    envVars:
      - key: PORT
        value: 9092
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: COURSE_SERVICE_URL
        value: http://course-service.render.internal:9091

  # 5. Learn Progress Service
  - type: web
    name: learn-progress-service
    env: docker
    plan: free
    rootDir: LS-backend/learn-progress-service
    envVars:
      - key: PORT
        value: 9093
      - key: SPRING_MONGODB_URI
        sync: false
      - key: COURSE_SERVICE_URL
        value: http://course-service.render.internal:9091
      - key: ENROLLMENT_SERVICE_URL
        value: http://enrollment-service.render.internal:9092
      - key: DISCUSSION_SERVICE_URL
        value: http://discussion-notification-service.render.internal:9094
      - key: ADMIN_ANALYTICS_SERVICE_URL
        value: http://admin-analytics-service.render.internal:9095

  # 6. Discussion Notification Service
  - type: web
    name: discussion-notification-service
    env: docker
    plan: free
    rootDir: LS-backend/discussion-notification-service
    envVars:
      - key: PORT
        value: 9094
      - key: SPRING_MONGODB_URI
        sync: false
      - key: COURSE_SERVICE_URL
        value: http://course-service.render.internal:9091

  # 7. Admin Analytics Service
  - type: web
    name: admin-analytics-service
    env: docker
    plan: free
    rootDir: LS-backend/admin-analytics-service
    envVars:
      - key: PORT
        value: 9095
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # 8. Certificate Service
  - type: web
    name: certificate-service
    env: docker
    plan: free
    rootDir: LS-backend/certificate-service
    envVars:
      - key: PORT
        value: 9099
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: CERTIFICATE_SERVICE_URL
        value: http://certificate-service.render.internal:9099
