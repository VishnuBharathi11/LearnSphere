# Render Blueprint Specification for LearnSphere Microservices using Docker
services:

  # 1. API Gateway
  - type: web
    name: api-gateway
    env: docker
    plan: free
    rootDir: LS-backend/api-gateway
    envVars:
      - key: PORT
        value: 8084
      - key: AUTH_SERVICE_HOSTPORT
        fromService:
          name: auth-service
          type: web
          property: hostport
      - key: ENROLLMENT_SERVICE_HOSTPORT
        fromService:
          name: enrollment-service
          type: web
          property: hostport
      - key: DISCUSSION_SERVICE_HOSTPORT
        fromService:
          name: discussion-notification-service
          type: web
          property: hostport
      - key: ADMIN_SERVICE_HOSTPORT
        fromService:
          name: admin-analytics-service
          type: web
          property: hostport
      - key: PROGRESS_SERVICE_HOSTPORT
        fromService:
          name: learn-progress-service
          type: web
          property: hostport
      - key: COURSE_SERVICE_HOSTPORT
        fromService:
          name: course-service
          type: web
          property: hostport
      - key: CERTIFICATE_SERVICE_HOSTPORT
        fromService:
          name: certificate-service
          type: web
          property: hostport

  # 2. Auth Service
  - type: web
    name: auth-service
    env: docker
    plan: free
    rootDir: LS-backend/auth-service
    envVars:
      - key: PORT
        value: 9098
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: ADMIN_ANALYTICS_SERVICE_HOSTPORT
        fromService:
          name: admin-analytics-service
          type: web
          property: hostport

  # 3. Course Service
  - type: web
    name: course-service
    env: docker
    plan: free
    rootDir: LS-backend/course-service
    envVars:
      - key: PORT
        value: 9091
      - key: SPRING_MONGODB_URI
        sync: false

  # 4. Enrollment Service
  - type: web
    name: enrollment-service
    env: docker
    plan: free
    rootDir: LS-backend/enrollment-service
    envVars:
      - key: PORT
        value: 9092
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: COURSE_SERVICE_HOSTPORT
        fromService:
          name: course-service
          type: web
          property: hostport

  # 5. Learn Progress Service
  - type: web
    name: learn-progress-service
    env: docker
    plan: free
    rootDir: LS-backend/learn-progress-service
    envVars:
      - key: PORT
        value: 9093
      - key: SPRING_MONGODB_URI
        sync: false
      - key: COURSE_SERVICE_HOSTPORT
        fromService:
          name: course-service
          type: web
          property: hostport
      - key: ENROLLMENT_SERVICE_HOSTPORT
        fromService:
          name: enrollment-service
          type: web
          property: hostport
      - key: DISCUSSION_SERVICE_HOSTPORT
        fromService:
          name: discussion-notification-service
          type: web
          property: hostport
      - key: ADMIN_ANALYTICS_SERVICE_HOSTPORT
        fromService:
          name: admin-analytics-service
          type: web
          property: hostport

  # 6. Discussion Notification Service
  - type: web
    name: discussion-notification-service
    env: docker
    plan: free
    rootDir: LS-backend/discussion-notification-service
    envVars:
      - key: PORT
        value: 9094
      - key: SPRING_MONGODB_URI
        sync: false
      - key: COURSE_SERVICE_HOSTPORT
        fromService:
          name: course-service
          type: web
          property: hostport

  # 7. Admin Analytics Service
  - type: web
    name: admin-analytics-service
    env: docker
    plan: free
    rootDir: LS-backend/admin-analytics-service
    envVars:
      - key: PORT
        value: 9095
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

  # 8. Certificate Service
  - type: web
    name: certificate-service
    env: docker
    plan: free
    rootDir: LS-backend/certificate-service
    envVars:
      - key: PORT
        value: 9099
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: FRONTEND_PUBLIC_URL
        sync: false
      - key: CERTIFICATE_SERVICE_HOSTPORT
        fromService:
          name: certificate-service
          type: web
          property: hostport
